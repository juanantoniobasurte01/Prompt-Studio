name: Build Windows executable

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build
        shell: pwsh
        run: ./scripts/empaquetar_windows.ps1
      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -LiteralPath dist/promptstudio.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  promptstudio.exe" | Set-Content -LiteralPath dist/SHA256SUMS.txt -Encoding utf8
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: promptstudio-windows-x64
          path: |
            dist/promptstudio.exe
            dist/SHA256SUMS.txt
            dist/ai-models/README.md
          if-no-files-found: error
