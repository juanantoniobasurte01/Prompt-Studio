name: Bug report
description: Report a problem in the app or a model guide.
body:
  - type: input
    id: version
    attributes:
      label: App version and Windows version
    validations:
      required: true
  - type: input
    id: profile
    attributes:
      label: Selected model profile
      description: Leave blank if no profile was selected.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Minimal prompt or relevant log
      description: Remove personal information, file paths and credentials before posting.
